<div class="container mx-auto p-4">
  <div class="grid grid-cols-4 gap-6">
    <!-- Filters Panel -->
    <div class="col-span-1">
      <app-product-filters></app-product-filters>
    </div>

    <!-- Products List -->
    <div class="col-span-3">
      <div class="product-list">
        <div class="header-actions">
          <button class="add-product-btn" (click)="onAddProduct()">
            Add Product
          </button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>SKU</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of products$ | async">
              <td>{{ product.name }}</td>
              <td>{{ product.sku }}</td>
              <td>${{ product.price.toFixed(2) }}</td>
              <td>
                <span class="stock-status stock-status-{{getStockStatus(product).status}}">
                  {{ product.stockQuantity }} - {{ getStockStatus(product).message }}
                </span>
              </td>
              <td>{{ product.category?.name || 'Uncategorized' }}</td>
              <td class="actions">
                <button class="view-btn" (click)="onProductClick(product.id)">View</button>
                <button class="edit-btn" (click)="onEditProduct(product.id)">Edit</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
