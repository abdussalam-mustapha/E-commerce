<div class="container mx-auto p-4">
  <div class="form-container">
    <div class="product-form">
      <h2 class="title">{{ isEditing ? 'Edit' : 'Add' }} Product</h2>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name" class="label">Name</label>
          <input type="text" id="name" name="name" [(ngModel)]="product.name" class="input" required>
        </div>

        <div class="form-group">
          <label for="sku" class="label">SKU</label>
          <input type="text" id="sku" name="sku" [(ngModel)]="product.sku" class="input" required>
        </div>

        <div class="form-group">
          <label for="description" class="label">Description</label>
          <textarea id="description" name="description" [(ngModel)]="product.description" class="textarea"></textarea>
        </div>

        <div class="form-group">
          <label for="price" class="label">Price</label>
          <input type="number" id="price" name="price" [(ngModel)]="product.price" min="0" class="input" required>
        </div>

        <div class="form-group">
          <label for="stockQuantity" class="label">Stock Quantity</label>
          <input type="number" id="stockQuantity" name="stockQuantity" [(ngModel)]="product.stockQuantity" min="0" class="input" required>
        </div>

        <div class="form-group">
          <label for="lowStockThreshold" class="label">Low Stock Threshold</label>
          <input type="number" id="lowStockThreshold" name="lowStockThreshold" [(ngModel)]="product.lowStockThreshold" min="1" class="input" required>
        </div>

        <div class="form-group">
          <label for="category" class="label">Category</label>
          <select id="category" name="category" [(ngModel)]="product.category" class="input" required>
            <option [ngValue]="undefined">Select a category</option>
            <option *ngFor="let category of categories" [ngValue]="category">
              {{ category.name }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label class="label">Tags</label>
          <div class="tags-input">
            <input type="text" [(ngModel)]="newTag" name="newTag" placeholder="Add a tag" class="input">
            <button type="button" (click)="addTag()" class="btn btn-secondary">Add</button>
          </div>
          <div class="tags-list" *ngIf="product.tags?.length">
            <span class="tag" *ngFor="let tag of product.tags">
              {{ tag }}
              <button type="button" (click)="removeTag(tag)" class="tag-remove">&times;</button>
            </span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">{{ isEditing ? 'Update' : 'Create' }} Product</button>
          <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
