<div class="container mx-auto p-4">
  <div class="form-container">
    <h1 class="title">{{isEditMode ? "Edit" : "Create"}} Product</h1>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">
      <div class="form-group">
        <label for="name" class="label">Product Name</label>
        <input 
          id="name" 
          type="text" 
          formControlName="name"
          class="input"
          [class.error]="productForm.get('name')?.invalid && productForm.get('name')?.touched"
          placeholder="Enter product name">
        <p *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" 
           class="error-message">Name is required</p>
      </div>

      <div class="form-group">
        <label for="sku" class="label">SKU</label>
        <input 
          id="sku" 
          type="text" 
          formControlName="sku"
          class="input"
          [class.error]="productForm.get('sku')?.invalid && productForm.get('sku')?.touched"
          placeholder="Enter SKU">
        <p *ngIf="productForm.get('sku')?.invalid && productForm.get('sku')?.touched" 
           class="error-message">SKU is required</p>
      </div>

      <div class="form-group">
        <label for="price" class="label">Price</label>
        <input 
          id="price" 
          type="number" 
          formControlName="price"
          class="input"
          [class.error]="productForm.get('price')?.invalid && productForm.get('price')?.touched"
          placeholder="0.00">
        <p *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched" 
           class="error-message">Price must be greater than 0</p>
      </div>

      <div class="form-group">
        <label for="stock" class="label">Stock</label>
        <input 
          id="stock" 
          type="number" 
          formControlName="stock"
          class="input"
          [class.error]="productForm.get('stock')?.invalid && productForm.get('stock')?.touched"
          placeholder="0">
        <p *ngIf="productForm.get('stock')?.invalid && productForm.get('stock')?.touched" 
           class="error-message">Stock must be 0 or greater</p>
      </div>

      <div class="form-group">
        <label for="description" class="label">Description</label>
        <textarea 
          id="description" 
          formControlName="description" 
          rows="4" 
          class="textarea"
          placeholder="Enter product description"></textarea>
      </div>

      <div class="form-actions">
        <button 
          type="button" 
          (click)="onCancel()" 
          class="btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
          Cancel
        </button>
        <button 
          type="submit" 
          [disabled]="!productForm.valid" 
          class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
          </svg>
          {{isEditMode ? "Update" : "Create"}} Product
        </button>
      </div>
    </form>
  </div>
</div>
